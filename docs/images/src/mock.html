<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>dsh-pr-review README mock</title>
<style>
  :root{
    --bg:#fff; --bg-soft:#f7f7f8; --bg-sunken:#f2f2f4;
    --border:#e5e5e8; --border-strong:#d6d6db;
    --text:#1d1d1f; --muted:#6e6e73; --faint:#9a9aa0;
    --blue:#0b6bcb; --blue-soft:#eaf3ff;
    --green:#1a7f37; --green-soft:#e8f5ec;
    --amber:#9a6700; --amber-soft:#fff4d6;
    --red:#cf222e; --red-soft:#ffebe9;
    --add:#e6ffec; --add-strong:#ccffd8; --del:#ffebe9;
    --mono:"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font:12.5px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased}
  .app{display:flex;width:1800px;height:1000px;overflow:hidden;background:var(--bg)}
  .muted{color:var(--muted)}
  .faint{color:var(--faint)}
  .mono{font-family:var(--mono)}
  .tag{display:inline-flex;align-items:center;height:17px;padding:0 6px;border-radius:5px;font-size:10.5px;font-weight:600;flex:0 0 auto}
  .tag.warn{background:var(--amber-soft);color:var(--amber)}
  .tag.ok{background:var(--green-soft);color:var(--green)}
  .tag.err{background:var(--red-soft);color:var(--red)}
  .tag.info{background:var(--blue-soft);color:var(--blue)}
  .dot{width:6px;height:6px;border-radius:50%;flex:0 0 auto}
  .dot.g{background:#2da44e}.dot.b{background:#2f6feb}.dot.a{background:#bf8700}.dot.k{background:#8c959f}

  /* ── left chat column ─────────────────────────────────────── */
  .chat{width:368px;flex:0 0 368px;border-right:1px solid var(--border);background:#fbfbfc;display:flex;flex-direction:column}
  .chat-head{padding:14px 14px 10px;border-bottom:1px solid var(--border)}
  .chrome{display:flex;align-items:center;gap:8px;margin-bottom:12px}
  .lights{display:flex;gap:5px}
  .lights i{width:9px;height:9px;border-radius:50%;display:block;background:#ff5f57}
  .lights i:nth-child(2){background:#febc2e}.lights i:nth-child(3){background:#28c840}
  .chrome-title{font-size:11px;color:var(--faint);margin-left:2px}
  .chat-titlerow{display:flex;align-items:center;gap:8px}
  .chat-title{font-size:14px;font-weight:650;letter-spacing:.01em}
  .entry{margin-left:auto;display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 9px;
    border:1px solid var(--border-strong);border-radius:8px;background:#fff;font-size:11.5px;font-weight:600;color:var(--text)}
  .entry .n{display:inline-flex;align-items:center;justify-content:center;min-width:16px;height:16px;padding:0 4px;
    border-radius:999px;background:#1f2328;color:#fff;font-size:9.5px;font-weight:700}
  .chat-body{flex:1;padding:16px 16px 8px;display:flex;flex-direction:column;gap:14px;overflow:hidden}
  .msg{display:flex;flex-direction:column;gap:5px}
  .msg .who{font-size:10.5px;color:var(--faint)}
  .bubble{max-width:300px;padding:9px 11px;border-radius:12px;line-height:1.5}
  .msg.user{align-items:flex-end}
  .msg.user .bubble{background:#f0f1f3;border:1px solid #ececef;border-bottom-right-radius:4px}
  .msg.ai .bubble{background:#fff;border:1px solid var(--border);border-bottom-left-radius:4px;max-width:320px}
  .bubble b{font-weight:650}
  .kv{display:flex;flex-direction:column;gap:2px;margin-top:6px;font-size:11.5px;color:var(--muted)}
  .composer{margin:0 14px 14px;border:1px solid var(--border);border-radius:12px;background:#fff;padding:10px 11px 8px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
  .composer .ph{color:var(--faint);font-size:12px;margin-bottom:10px}
  .composer .row{display:flex;align-items:center;gap:8px}
  .chip{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 7px;border:1px solid var(--border);border-radius:6px;font-size:10.5px;color:var(--muted);background:#fafafb}
  .composer .send{margin-left:auto;width:26px;height:26px;border-radius:50%;background:#1f2328;color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px}

  /* ── review panel ─────────────────────────────────────────── */
  .panel{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--bg)}
  .panel-top{height:44px;flex:0 0 44px;display:flex;align-items:center;gap:12px;padding:0 14px;border-bottom:1px solid var(--border)}
  .pr-title{font-size:12.5px;font-weight:650;white-space:nowrap;display:flex;align-items:center;gap:5px}
  .pr-title .num{color:var(--muted);font-weight:600}
  .chev{color:var(--faint);font-size:10px}
  .rounds{display:flex;align-items:center;gap:6px;min-width:0;overflow:hidden}
  .round{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border:1px solid transparent;border-radius:6px;
    background:var(--bg-soft);color:var(--muted);font-size:10.5px;white-space:nowrap}
  .round.active{background:#eef4ff;border-color:#c9dcff;color:#2456a8;font-weight:650}
  .round .mini{font-size:9px;padding:0 4px;height:13px;border-radius:4px;background:#fff;border:1px solid var(--border);color:var(--muted)}
  .top-actions{margin-left:auto;display:flex;align-items:center;gap:10px;white-space:nowrap}
  .top-actions .refresh{font-size:11px;color:var(--muted)}
  .btn{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:7px;border:1px solid var(--border-strong);
    background:#fff;color:var(--text);font-size:11.5px;font-weight:600;white-space:nowrap}
  .btn.dark{background:#1f2328;border-color:#1f2328;color:#fff}
  .btn.ghost{border-color:transparent;background:transparent;color:var(--muted);font-weight:500}

  .panel-body{flex:1;min-height:0;display:flex}
  .files{width:404px;flex:0 0 404px;border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0}
  .tabs{height:38px;flex:0 0 38px;display:flex;align-items:flex-end;gap:16px;padding:0 14px;border-bottom:1px solid var(--border)}
  .tab{height:38px;display:flex;align-items:center;font-size:12px;color:var(--muted)}
  .tab.active{color:var(--text);font-weight:650;box-shadow:inset 0 -2px 0 #1f2328}
  .files-head{display:flex;align-items:center;justify-content:space-between;padding:11px 14px 7px;font-size:11px;color:var(--muted)}
  .files-head b{color:var(--text);font-size:11.5px;font-weight:650}
  .file-list{list-style:none;margin:0;padding:0 6px 10px;overflow:hidden}
  .file-list li{display:flex;align-items:center;gap:8px;height:28px;padding:0 9px;border-radius:6px;font-size:11.5px}
  .file-list li.sel{background:#eef4ff}
  .file-list .idx{width:18px;color:var(--faint);font-size:10.5px;text-align:right;flex:0 0 18px}
  .file-list .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#24292f}
  .file-list .nm .dir{color:var(--muted)}
  .stat{font-family:var(--mono);font-size:10px;white-space:nowrap;flex:0 0 auto}
  .stat .p{color:#1a7f37}.stat .m{color:#cf222e}

  .content{flex:1;min-width:0;overflow:hidden;display:flex;flex-direction:column}
  .scroll{flex:1;overflow:hidden;padding:18px 24px}
  .h1{font-size:15px;font-weight:700;margin:0 0 10px;display:flex;align-items:center;gap:8px}
  .sec{margin-bottom:20px}
  .sec h2{font-size:12px;font-weight:650;margin:0 0 8px;color:var(--text)}
  .sec p{margin:0;color:#3c3c43;line-height:1.6}
  .list{margin:0;padding-left:0;list-style:none}
  .list li{display:flex;gap:8px;padding:5px 0;line-height:1.5;color:#3c3c43}
  .list .n{color:var(--faint);width:14px;flex:0 0 14px;text-align:right;font-size:11px;padding-top:1px}
  .code{font-family:var(--mono);font-size:11px;background:var(--bg-soft);border:1px solid var(--border);border-radius:5px;padding:1px 5px;color:#24292f;white-space:nowrap}
  .finding-row{display:flex;align-items:baseline;gap:8px;padding:6px 0;border-bottom:1px solid #f0f0f2}
  .finding-row:last-child{border-bottom:0}
  .finding-row .fname{font-family:var(--mono);font-size:11px;color:#24292f;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .finding-row .ftext{font-size:11px;color:var(--muted);white-space:nowrap}
  .order{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:11.5px;color:#3c3c43}
  .order .ord{width:16px;height:16px;border-radius:50%;background:var(--bg-soft);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:9.5px;color:var(--muted)}
  .conclusion{border:1px solid var(--border);border-radius:9px;padding:12px 13px;background:#fcfcfd}
  .conclusion .head{display:flex;align-items:center;gap:8px;margin-bottom:6px}
  .conclusion .head b{font-size:12px}
  .conclusion .v{font-size:10.5px;color:var(--faint);font-family:var(--mono)}

  .findings{width:340px;flex:0 0 340px;border-left:1px solid var(--border);display:flex;flex-direction:column;background:#fcfcfd}
  .findings-head{height:38px;flex:0 0 38px;display:flex;align-items:center;padding:0 14px;border-bottom:1px solid var(--border);font-size:11.5px;font-weight:650}
  .findings-body{flex:1;overflow:hidden;padding:12px 14px;display:flex;flex-direction:column;gap:12px}
  .card{border:1px solid var(--border);border-radius:8px;background:#fff;padding:10px 11px}
  .card .top{display:flex;align-items:center;gap:7px;margin-bottom:5px}
  .card .fname{font-family:var(--mono);font-size:10.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .card p{margin:0;font-size:11.5px;line-height:1.55;color:#3c3c43}
  .card .line{margin-top:5px;font-size:10.5px;color:var(--faint)}
  .card .hint{margin-top:6px;font-size:10.5px;color:var(--blue)}

  /* ── diff view ────────────────────────────────────────────── */
  .diff-head{height:38px;flex:0 0 38px;display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid var(--border)}
  .diff-head .fname{font-family:var(--mono);font-size:11.5px;font-weight:600}
  .diff-head .actions{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:10.5px;color:var(--muted);white-space:nowrap}
  .diff-head .actions .sep{color:var(--border-strong)}
  .diff{flex:1;overflow:hidden;background:#fff;font-family:var(--mono);font-size:11px;line-height:1.65}
  .dl{display:flex;min-height:18px;white-space:pre}
  .dl .ln{width:44px;flex:0 0 44px;text-align:right;padding-right:10px;color:#a0a0a7;background:#fafafb;border-right:1px solid #f0f0f2;user-select:none}
  .dl .code{padding-left:12px;flex:1;min-width:0;overflow:hidden}
  .dl.add{background:var(--add)}
  .dl.add .ln{background:var(--add-strong)}
  .dl.del{background:var(--del)}
  .dl.hunk{background:#f2f6ff;color:#2456a8}
  .dl.hunk .ln{background:#f2f6ff;border-right-color:#e2e9f8}
  .dl.head{background:#fafafb;color:#6e6e73}
  .dl.head .ln{background:#fafafb}
  .kw{color:#cf222e}.str{color:#0a3069}.fn{color:#8250df}.cm{color:#6e7781;font-style:italic}.num{color:#0550ae}

  .popover{position:absolute;right:16px;top:54px;width:372px;border:1px solid var(--border-strong);border-radius:10px;
    background:#fff;box-shadow:0 12px 32px rgba(0,0,0,.16);padding:13px 14px 14px;z-index:5}
  .popover .phead{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .popover .phead b{font-size:11.5px}
  .popover .phead .x{margin-left:auto;color:var(--faint);font-size:14px}
  .popover p{margin:0 0 8px;font-size:11.5px;line-height:1.6;color:#3c3c43}
  .popover p:last-child{margin-bottom:0}
  .popover .hit{background:#fff3c4;border-radius:2px}
  .popover .foot{display:flex;justify-content:flex-end;margin-top:10px}
  .popover .foot .btn{height:24px;font-size:10.5px}

  .actionbar{height:48px;flex:0 0 48px;border-top:1px solid var(--border);display:flex;align-items:center;gap:8px;padding:0 14px;background:#fff}
  .actionbar .hint{font-size:10.5px;color:var(--muted)}
  .actionbar .spacer{flex:1}
</style>
</head>

  const el = (html) => html;
  const fileList = (selected) => S.files.map(([name, add, del], i) => {
    const slash = name.lastIndexOf('/');
    const dir = name.slice(0, slash + 1);
    const base = name.slice(slash + 1);
    return `<li class="${selected === i ? 'sel' : ''}">
      <span class="idx">${i + 1}</span>
      <span class="nm"><span class="dir">${dir}</span>${base}</span>
      <span class="stat"><span class="p">${add}</span> <span class="m">${del}</span></span>

  }).join('');

  const overview = `
    <div class="scroll">
      <div class="h1">${S.assess} <span class="tag ok">${S.pass}</span></div>
      <p style="margin:0 0 18px;color:#3c3c43;line-height:1.65;max-width:720px">${S.assessP}</p>

          <li><span class="n">1</span><span><span class="tag warn">${S.suggestion}</span> ${S.risk1} <span class="code">src/export/csv.ts:37</span></span></li>

        </ul>
      </div>

      <div class="sec">
