- insert:
    - id: pr-review
      name: '@modouai/dsh-pr-review'
      config:
        # 仓库选择：有会话工作区的 git origin 时，仓库与平台均以 origin 为准。
        # baseUrl / repo / token 三项默认为空；显式填写后，仅在工作区 origin 识别完成前
        # 作为临时轮询/自动审查目标，识别完成后被 origin 覆盖。非 git 工作区不激活仓库，也不轮询。
        # platform：github / gitea / forgejo / gitlab / gitee / gitcode / atomgit / codeup
        # （gitea 与 forgejo 同一 API，二者等价）
        platform: 'forgejo'
        baseUrl: ''
        repo: ''
        token: ''
        # 仅 codeup 使用：organizationId 留空时取 origin 首段；projectId 留空时自动解析
        organizationId: ''
        projectId: ''
        pollSeconds: 60
        autoReview: true
        # 每轮审查完成后自动逐个分析全部变更文件；关闭后只在点开文件或点「全部分析」时分析。
        # 单 PR 内逐个分析，跨 PR 最多 2 个并发；应用重启后打开面板会续跑。
        # 每个文件一次模型调用，注意配额与限流。
        autoAnalyze: true
        provider: ''
        model: ''
        reasoningEffort: 'off'
        maxDiffCharsPerFile: 14000
        commentLanguage: 'zh'
        autoReconclude: false
        # 两轮审查：先产出候选问题与所需证据，宿主取证后再按置信度判定。
        # 有候选问题时每个文件多一次复审调用；关闭后退回单轮。
        evidenceVerify: true
        evidenceMaxFiles: 6
        evidenceMaxChars: 6000
    - id: preset-pr-review-readonly
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: pr-review-readonly
        order: 50
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |
                你是资深代码审查员，只读地审查当前 PR。只通过 review_* 工具写回结论；不修改工作区、不发布评论。
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              write: false
              edit: false
              applyPatch: false
              readImage: false
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
