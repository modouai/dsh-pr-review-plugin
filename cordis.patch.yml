- insert:
    - id: pr-review
      name: '@modouai/dsh-pr-review'
      config:
        # 仓库选择：会话工作区有 git origin 时以工作区为准；以下三项是工作区解析出仓库之前的默认目标，
        # 用于启动后的轮询与自动审查。面板始终跟随工作区 origin；非 git 工作区不会使用这里的仓库。
        # platform：github / gitea / forgejo / gitlab / gitee / gitcode / atomgit / codeup
        # （gitea 与 forgejo 同一 API，二者等价）
        platform: 'forgejo'
        baseUrl: ''
        repo: ''
        token: ''
        # 仅 codeup 使用：organizationId 留空时取 origin 首段；projectId 留空时自动解析
        organizationId: ''
        projectId: ''
        pollSeconds: 60
        autoReview: true
        provider: ''
        model: ''
        reasoningEffort: 'off'
        maxDiffCharsPerFile: 14000
        commentLanguage: 'zh'
        autoReconclude: false
