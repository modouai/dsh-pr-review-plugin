- insert:
    - id: pr-review
      name: '@modouai/dsh-pr-review'
      config:
        # 仓库选择：面板始终跟随会话工作区的 git origin。以下三项默认为空；显式填写后，
        # 作为工作区识别前的轮询/自动审查目标。非 git 工作区不会激活仓库，也不轮询。
        # platform：github / gitea / forgejo / gitlab / gitee / gitcode / atomgit / codeup
        # （gitea 与 forgejo 同一 API，二者等价）
        platform: 'forgejo'
        baseUrl: ''
        repo: ''
        token: ''
        # 仅 codeup 使用：organizationId 留空时取 origin 首段；projectId 留空时自动解析
        organizationId: ''
        projectId: ''
        pollSeconds: 60
        autoReview: true
        provider: ''
        model: ''
        reasoningEffort: 'off'
        maxDiffCharsPerFile: 14000
        commentLanguage: 'zh'
        autoReconclude: false
