- insert:
    - id: pr-review
      name: '@modouai/dsh-pr-review'
      config:
        # 仓库选择：有会话工作区的 git origin 时，仓库与平台均以 origin 为准。
        # baseUrl / repo / token 三项默认为空；显式填写后，仅在工作区 origin 识别完成前
        # 作为临时轮询/自动审查目标，识别完成后被 origin 覆盖。非 git 工作区不激活仓库，也不轮询。
        # platform：github / gitea / forgejo / gitlab / gitee / gitcode / atomgit / codeup
        # （gitea 与 forgejo 同一 API，二者等价）
        platform: 'forgejo'
        baseUrl: ''
        repo: ''
        token: ''
        # 仅 codeup 使用：organizationId 留空时取 origin 首段；projectId 留空时自动解析
        organizationId: ''
        projectId: ''
        pollSeconds: 60
        autoReview: true
        # 每轮审查完成后自动逐个分析全部变更文件；关闭后只在点开文件或点「全部分析」时分析。
        # 单 PR 内逐个分析，跨 PR 最多 2 个并发；应用重启后打开面板会续跑。
        # 每个文件一次模型调用，注意配额与限流。
        autoAnalyze: true
        provider: ''
        model: ''
        reasoningEffort: 'off'
        maxDiffCharsPerFile: 14000
        commentLanguage: 'zh'
        autoReconclude: false
        # 调查链路预算：模型提出可证伪的断言并申请证据，宿主取证，循环到每条断言被确认或证伪。
        # 步数/文件数/字符数/墙钟任一用尽即强制收口；refuteLevel 控制已确认意见是否进入反驳复核。
        investigationMaxSteps: 8
        investigationMaxFiles: 12
        investigationMaxChars: 4000
        investigationMaxTotalChars: 24000
        investigationTimeoutMs: 600000
        refuteLevel: block
        refuteMaxQueries: 3
